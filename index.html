<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Librería Comercial | Asunción</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#0F2A3C}
body{font-family:Georgia,serif;background:#0F2A3C;color:#fff}
header{background:#0F2A3C;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1px solid #1E3A4F}
.logo{font-size:21px;font-weight:bold;letter-spacing:.5px;line-height:1}
.logo span{color:#C9A86A}
nav{display:flex;align-items:center;gap:16px;font-family:Arial,sans-serif}
nav a{color:#E8DDC8;text-decoration:none;font-size:13px}
.nav-gold{background:#C9A86A;color:#0F2A3C;padding:8px 14px;border-radius:6px;font-weight:bold;font-size:13px;text-decoration:none;font-family:Arial}
.cart-btn{background:#C9A86A;color:#0F2A3C;padding:9px 14px;border-radius:6px;font-weight:bold;border:none;cursor:pointer;font-family:Arial;font-size:13px}
.hero{padding:50px 20px 40px;text-align:center;background:#0F2A3C}
.hero small{color:#C9A86A;letter-spacing:3px;font-size:11px;font-family:Arial;font-weight:bold}
.hero h1{font-size:38px;line-height:1.15;max-width:700px;margin:14px auto 12px}
.hero p{font-family:Arial;font-size:14px;color:#CFCFCF;max-width:560px;margin:0 auto 22px;line-height:1.6}
.btn-gold{display:inline-block;background:#C9A86A;color:#0F2A3C;padding:12px 24px;border-radius:6px;text-decoration:none;font-family:Arial;font-weight:bold;font-size:14px}
.btn-line{display:inline-block;background:transparent;color:#fff;padding:12px 24px;border:1px solid #fff;border-radius:6px;text-decoration:none;font-family:Arial;font-size:14px;margin-left:10px}
.bar{background:#C9A86A;color:#0F2A3C;text-align:center;padding:10px;font-family:Arial;font-size:12px;font-weight:bold}
.section{max-width:1100px;margin:0 auto;padding:36px 20px}
.section h3{font-size:28px}
.section p.sub{font-family:Arial;color:#B8C2C9;margin:8px 0 20px;font-size:14px}
.search{width:100%;padding:12px;border:1px solid #2A4256;border-radius:8px;background:#132F46;color:#fff;margin-bottom:20px;font-size:14px;font-family:Arial}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#162E42;border:1px solid #2A4256;border-radius:10px;overflow:hidden}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#222}
.card-body{padding:18px}

.card h4{font-size:19px;margin:7px 0 6px;line-height:1.3}
.card p{font-family:Arial;font-size:13px;color:#B8C2C9;line-height:1.5;min-height:38px}
.price{font-family:Arial;font-weight:bold;margin-top:10px;font-size:16px}
.price s{color:#7A8A95;font-size:13px;font-weight:normal;margin-left:6px}
.card button.add{width:100%;margin-top:14px;background:#1E4A68;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:bold;cursor:pointer;font-family:Arial}
.why-card{background:#162E42;border:1px solid #2A4256;border-radius:10px;padding:20px}
.why-card h4{margin:8px 0 6px}
.why-card p{font-family:Arial;font-size:13px;color:#B8C2C9;line-height:1.5}
.info{background:#162E42;border:1px solid #2A4256;border-radius:12px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.info h3{color:#C9A86A;font-size:22px}
.info p,.info ul{font-family:Arial;font-size:14px;line-height:1.6;color:#D0D8DD;margin-top:10px;list-style:none}
.wa-box{margin-top:16px;background:#C9A86A;color:#0F2A3C;padding:13px;border-radius:8px;text-align:center;font-weight:bold;font-family:Arial}
footer{background:#0A1E2B;color:#8A9AA5;text-align:center;padding:20px;font-family:Arial;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:60}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;width:100%;max-width:380px;height:100%;background:#fff;z-index:61;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;font-family:Arial;color:#1A1A1A}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:18px;background:#0F2A3C;color:white;display:flex;justify-content:space-between;align-items:center}
.drawer-head button{background:white;border:none;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:bold}
.drawer-body{flex:1;overflow:auto;padding:16px}
.item{display:flex;gap:10px;border-bottom:1px solid #eee;padding:12px 0;align-items:center}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.item-info{flex:1}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
