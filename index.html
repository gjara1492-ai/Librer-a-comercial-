<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librería Comercial | Asunción</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Georgia, serif; background:#0F2A3C; color:#fff; }
header { background:#0F2A3C; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1E3A4F; }
.logo { font-size:21px; font-weight:bold; }
.logo span { color:#C9A86A; }
nav a { color:#E8DDC8; text-decoration:none; font-family:Arial; font-size:13px; margin-left:14px; }
.nav-gold { background:#C9A86A; color:#0F2A3C!important; padding:8px 14px; border-radius:6px; font-weight:bold; }
.hero { padding:50px 20px 40px; text-align:center; }
.hero small { color:#C9A86A; letter-spacing:3px; font-size:11px; font-family:Arial; font-weight:bold; }
.hero h1 { font-size:36px; max-width:700px; margin:14px auto 12px; line-height:1.15; }
.hero p { font-family:Arial; font-size:14px; color:#CFCFCF; max-width:560px; margin:0 auto 22px; line-height:1.6; }
.btn-gold { display:inline-block; background:#C9A86A; color:#0F2A3C; padding:12px 24px; border-radius:6px; text-decoration:none; font-family:Arial; font-weight:bold; }
.btn-line { display:inline-block; color:#fff; padding:12px 24px; border:1px solid #fff; border-radius:6px; text-decoration:none; font-family:Arial; margin-left:10px; }
.bar { background:#C9A86A; color:#0F2A3C; text-align:center; padding:10px; font-family:Arial; font-size:12px; font-weight:bold; }
.section { max-width:1100px; margin:0 auto; padding:36px 20px; }
.section h3 { font-size:28px; }
.sub { font-family:Arial; color:#B8C2C9; margin:8px 0 20px; font-size:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; }
.card { background:#162E42; border:1px solid #2A4256; border-radius:10px; overflow:hidden; }
.card img { width:100%; height:190px; object-fit:cover; display:block; }
.card-body { padding:18px; }
.card small { font-family:Arial; color:#C9A86A; font-weight:bold; font-size:11px; }
.card h4 { font-size:19px; margin:7px 0 6px; }
.card p { font-family:Arial; font-size:13px; color:#B8C2C9; line-height:1.5; min-height:38px; }
.price { font-family:Arial; font-weight:bold; margin-top:10px; }
.price s { color:#7A8A95; font-size:13px; font-weight:normal; margin-left:6px; }
.add { width:100%; margin-top:14px; background:#1E4A68; color:#fff; border:0; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-family:Arial; }
.why { background:#162E42; border:1px solid #2A4256; border-radius:10px; padding:20px; }
.why p { font-family:Arial; font-size:13px; color:#B8C2C9; line-height:1.5; }
.info { background:#162E42; border:1px solid #2A4256; border-radius:12px; padding:28px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.info h3 { color:#C9A86A; font-size:22px; }
.info p, .info ul { font-family:Arial; font-size:14px; line-height:1.6; color:#D0D8DD; margin-top:10px; list-style:none; }
.wa-box { margin-top:16px; background:#C9A86A; color:#0F2A3C; padding:13px; border-radius:8px; text-align:center; font-weight:bold; font-family:Arial; }
footer { background:#0A1E2B; color:#8A9AA5; text-align:center; padding:20px; font-family:Arial; font-size:12px; }
.drawer { position:fixed; top:0; right:0; width:100%; max-width:380px; height:100%; background:#fff; z-index:99; transform:translateX(100%); transition:.3s; display:flex; flex-direction:column; font-family:Arial; color:#111; }
.drawer.open { transform:translateX(0); }
.drawer-head { padding:18px; background:#0F2A3C; color:#fff; display:flex; justify-content:space-between; }
.drawer-head button { background:#fff; border:0; border-radius:50%; width:30px; height:30px; }
.drawer-body { flex:1; overflow:auto; padding:16px; }
.item { display:flex; gap:10px; border-bottom:1px solid #eee; padding:12px 0; align-items:center; }
.item img { width:60px; height:60px; object-fit:cover; border-radius:6px; }
.item-info { flex:1; }
.qty button { width:26px; height:26px; margin:0 4px; }
.remove { color:#c00; background:none; border:0; cursor:pointer; }
.drawer-foot { padding:16px; border-top:1px solid #eee; }
.total { font-weight:bold; display:flex; justify-content:space-between; margin-bottom:12px; }
.wa-btn { display:block; text-align:center; background:#25D366; color:#fff; padding:14px; border-radius:8px; text-decoration:none; font-weight:bold; }
.name-input { width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; margin-bottom:10px; }
@media(max-width:640px){ .hero h1{font-size:28px} .info{grid-template-columns:1fr} header{flex-direction:column;gap:10px} }
</style>
</head>
<body>
<header>
<div class="logo">LIBRERÍA <span>COMERCIAL</span></div
